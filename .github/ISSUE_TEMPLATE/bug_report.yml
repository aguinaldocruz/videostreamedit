name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include Plex tokens, private server URLs, or sensitive media paths.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: container
    attributes:
      label: Media container and codecs
      placeholder: MKV; H.264 video, AAC audio, SRT subtitles
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
  - type: input
    id: version
    attributes:
      label: Commit or image version
