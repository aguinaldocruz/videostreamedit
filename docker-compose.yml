name: videostreamedit

services:
# PostgreSQL is external to this deployment. Configure or migrate it from
# Setup → Tasks → Migrate; no database credentials are stored in Compose.
#
# Optional single-container mode (small/test hosts only):
#   docker compose build videostreamedit
#   docker compose --profile single-container build videostreamedit-all-in-one
#   docker compose --profile single-container up -d videostreamedit-all-in-one
# Stop `videostreamedit` first; both application modes must never run against
# the same persistent data simultaneously. The
# profile uses Dockerfile.all-in-one, supervises PostgreSQL and uvicorn in one
# container, and keeps the database under /data/postgres. The separated mode
# remains recommended for backups, upgrades, resource limits, and recovery.

  videostreamedit:
    # Replace this with a published image later, for example:
    # image: ghcr.io/your-user/videostreamedit:latest
    build:
      context: .
    image: videostreamedit:local
    container_name: videostreamedit
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    ports:
      - "8383:8080"

    environment:
      PUID: "1000"
      PGID: "1000"
      LANGUAGE_ID_URL: "http://language-id:9000"
      # The encrypted connection under /config is authoritative. This value
      # only selects the normal PostgreSQL adapter after startup.
      DATABASE_BACKEND: "postgres"
      # Preview extraction is on-demand. Keep concurrency at 1 unless benchmarked safely.
      # Never let staging/cache work consume the host reserve. A snapshot is
      # refused before copying when free space would fall below these limits.
      WORKFLOW_MIN_FREE_GB: "${WORKFLOW_MIN_FREE_GB:-5}"
      WORKFLOW_RESERVED_GB: "${WORKFLOW_RESERVED_GB:-2}"
      # Bounded parallelism for independent bulk stream edits. Per-media LUW
      # locks and signatures remain enabled; lower to 1 on slow storage.
      BULK_EDIT_WORKERS: "${BULK_EDIT_WORKERS:-3}"

    volumes:
      - /media/:/media
      - /home/docker/videostreamedit:/config
      - /home/docker/videostreamedit/data:/data
      # Portable database/config backups. This is intentionally separate from
      # /data so staged workflow files are never included in a backup archive.
      - /home/docker/videostreamedit/backup:/backup

    security_opt:
      - no-new-privileges:true



  # Dedicated spoken-language identification service.
  # It replaces the Whisper container for this project's language checks.
  language-id:
    build:
      context: ./language-id
    image: videostreamedit-language-id:local
    container_name: videostreamedit-language-id
    restart: unless-stopped
    init: true

    ports:
      - "9000:9000"

    environment:
      HF_HOME: "/models/huggingface"
      TRANSFORMERS_CACHE: "/models/huggingface"
      SPEECHBRAIN_CACHE: "/models/speechbrain"

    volumes:
      - /home/docker/videostreamedit/language-id-models:/models

    security_opt:
      - no-new-privileges:true

  # Optional application/database alternative. The language-id service is
  # still separate. Do not run alongside the default application.
  videostreamedit-all-in-one:
    profiles: ["single-container"]
    build:
      context: .
      dockerfile: Dockerfile.all-in-one
    image: videostreamedit:all-in-one
    container_name: videostreamedit-all-in-one
    restart: unless-stopped
    init: true
    # Allow application drain (90s) followed by a clean database checkpoint.
    stop_grace_period: 125s
    ports:
      - "8383:8080"
    environment:
      PUID: "1000"
      PGID: "1000"
      LANGUAGE_ID_URL: "http://language-id:9000"
      DATABASE_BACKEND: "postgres"
      # Existing encrypted external configuration is respected: in that case
      # no local PostgreSQL process is started. Fresh local databases use
      # generated credentials saved encrypted under /config, not Compose.
      # Old clusters require an explicit backup/restore, never automatic upgrade.
    volumes:
      - /media/:/media
      - /home/docker/videostreamedit:/config
      - /home/docker/videostreamedit/data:/data
      - /home/docker/videostreamedit/backup:/backup
    depends_on:
      language-id:
        condition: service_started
    security_opt:
      - no-new-privileges:true
